# ==============================================================================
#                 🎻 PROMPT FIDDLE CONFIGURATION FILE
# ==============================================================================

# Название локальной модели в Ollama (например: llama3.1, mistral, qwen2.5)
model: "smollm2:latest"

# Базовый URL для подключения к Ollama (по умолчанию: http://localhost:11434)
api_base: "http://localhost:11434"

# Системный промпт — глобальная инструкция, определяющая роль и поведение модели
# system_prompt: "Ты — опытный технический писатель. Сделай текст структурированным, используй списки и пиши строго по делу."

# ------------------------------------------------------------------------------
# РАСШИРЕННЫЕ ПАРАМЕТРЫ ГЕНЕРАЦИИ (OLLAMA OPTIONS)
# Настроены для максимальной детерминированности (воспроизводимости) результатов
# ------------------------------------------------------------------------------
options:
  # --- Точность и случайность ---
  temperature: 0.0          # Креативность (0.0 — жесткий детерминизм, модель выбирает только самые вероятные токены)
  seed: 42                  # Фиксация генерации (одинаковый seed + temp 0.0 дают идентичный ответ)
  top_p: 1.0                # Рассматривать абсолютно все токены (1.0 — отключено, управление идет через temp)
  top_k: 1                  # Выбирать строго один самый вероятный токен на каждом шаге генерации
  min_p: 0.0                # Минимальный порог вероятности для токенов (0.0 — отключено)

  # --- Ограничения длины ---
  num_ctx: 4096             # Размер контекстного окна в токенах (память под историю и промпт)
  num_predict: -1           # Максимальное число токенов на выходе (-1 — без ограничений, пока модель сама не закончит)

  # --- Штрафы за повторения (Отключены для стабильности структуры) ---
  repeat_penalty: 1.0       # Штраф за повторение одних и тех же слов (1.0 — без штрафа)
  repeat_last_n: 0          # Как далеко назад смотреть для применения штрафа (0 — отключено)
  presence_penalty: 0.0     # Штраф за возвращение к уже обсужденным темам (0.0 — отключено)
  frequency_penalty: 0.0    # Штраф, зависящий от частоты использования слова (0.0 — отключено)

  # --- Алгоритмы контроля качества (Отключены) ---
  mirostat: 0               # Динамическая подстройка под качество текста (0 — выключено, 1 — Mirostat, 2 — Mirostat 2.0)
  mirostat_eta: 0.1         # Скорость адаптации алгоритма Mirostat
  mirostat_tau: 5.0         # Целевая энтропия текста для Mirostat

  # --- Оптимизация производительности (Hardware) ---
  num_thread: 8             # Количество потоков процессора, выделяемых под вычисления (выставите под свой CPU)
